[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-subtitler"
version = "0.1.0"
description = "Transcribe, translate and burn subtitles into videos - locally, with faster-whisper and ffmpeg."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["faster-whisper>=1.0.0", "av>=12.0.0"]

[project.scripts]
subtitler = "subtitler:main"

[tool.hatch.build.targets.wheel]
include = ["subs_core.py", "subtitler.py", "server.py", "static"]
